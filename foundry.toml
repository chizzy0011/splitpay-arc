[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
# Pin to "paris" so the bytecode has no PUSH0 (Shanghai), which not every EVM
# chain supports. Safe default for new chains.
evm_version = "paris"

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
bot = "https://rpc.botchain.ai"

# Explorer verification (Arc explorers are Blockscout-style; the /api path and
# key may need adjusting once you confirm Arc's verification endpoint).
[etherscan]
arc_testnet = { key = "${EXPLORER_API_KEY}", url = "https://explorer.testnet.arc.io/api", chain = 5042002 }
arc_mainnet = { key = "${EXPLORER_API_KEY}", url = "https://explorer.arc.io/api", chain = 5042 }
bot = { key = "blockscout", url = "https://scan.botchain.ai/api/", chain = 677 }
